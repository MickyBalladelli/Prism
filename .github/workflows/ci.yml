name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Matrix runtime
        uses: actions/checkout@v4
        with:
          repository: MickyBalladelli/Matrix
          path: ../Matrix

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run typecheck && npm run build

      - name: Package import and metadata checks
        run: npm run check:package && npm run check:imports && npm run pack:check

      - name: DOM behavior checks
        run: npm test

      - name: Coverage
        run: npm run coverage

      - name: Accessibility smoke pass
        run: npm run check:accessibility

      - name: Showcase build
        run: npm ci --prefix examples/showcase && npm run showcase:build
